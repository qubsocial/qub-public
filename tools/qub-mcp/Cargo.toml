[package]
name = "qub-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "MCP server for qub — create, read, and verify time-locked qubs"

[dependencies]
qub-core = { workspace = true, default-features = true }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std"] }
hex = { workspace = true }
base64 = { workspace = true }
# CSPRNG for the private-delivery outer wrapper key + nonce. Workspace
# version is feature-gated `wasm_js`; the MCP tool is native so it
# transparently uses the OS RNG.
getrandom = { workspace = true }

[lints]
workspace = true
