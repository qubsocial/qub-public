[package]
name = "qub-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "MCP server for qub — create, read, and verify time-locked qubs"

[dependencies]
qub-core = { workspace = true, default-features = true }
# The verifier library: storage-transaction binding, the fail-closed timing
# verdict and the forecast-series report. The same code `qub-verify` runs, so
# an agent and a recipient with the CLI reach the same verdict.
qub-verify = { path = "../qub-verify" }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std"] }
hex = { workspace = true }
base64 = { workspace = true }
# CSPRNG for the private-delivery outer wrapper key + nonce. Workspace
# version is feature-gated `wasm_js`; the MCP tool is native so it
# transparently uses the OS RNG.
getrandom = { workspace = true }
# SHA3-256 for the keyed operation id and the API-key fingerprint stored in
# the operation journal (already the workspace's pinned hash).
sha3 = { workspace = true }

[dev-dependencies]
# SHA-256 for the recovery tests' mock Worker, which derives `scope_id`
# exactly as the real Worker does, and SHA-256/384 + RSA for the mock Arweave
# gateways of the public-mode tests, which sign a storage transaction for
# whatever the binary uploads. Never used by the binary.
sha2 = { workspace = true }
rsa = { workspace = true }

[lints]
workspace = true
