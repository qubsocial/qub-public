[package]
name = "qub-verify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Verifier for qub `.qub` export bundles — confirms content integrity, round binding, and authorship offline, and (with --timing) checks the storage transaction against Arweave gateways that qub does not run"

[dependencies]
qub-core = { workspace = true, default-features = true }
clap = { version = "4", features = ["derive"] }
base64 = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
# ANS-104 anchor verification (PROTOCOL.md §16.6/§16.8) — native-only, never
# reaches the WASM crates. `rsa` verifies the Arweave anchor DataItem's RSA-PSS
# signature; `sha2` supplies the Arweave-wire SHA-256/SHA-384 deepHash. Both are
# exact-pinned in [workspace.dependencies] (pre-1.0 crypto, Andre Finding 33).
rsa = { workspace = true }
sha2 = { workspace = true }
# `--timing` only: the one network path in this binary. It reads Arweave
# gateways — never a qub server — and is off unless the flag is given. Same
# version and TLS stack as qub-mcp.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "blocking",
] }

[lints]
workspace = true
